layout: side
title: TEXT-04 — Justified text
items:
  entries:
    - title: Short paragraph
      text: 'Compare this normal paragraph with the justified panel on the right.'
    - title: Lists and indentation
      text: '<ul><li>First item</li><li>Second item with <strong>bold words</strong></li></ul>'
highlight:
  text: 'A justified paragraph must preserve its text, its emphasis and its spacing. Browser and PowerPoint line breaking can disagree even when the font and the bounding rectangle match. This deliberately longer paragraph makes those differences visible without changing the theme layout.'
notes: |
  TEXT-04. Origine: layout main/side con highlight e reset delle liste del tema.
  Confrontare giustificazione, ultima riga, interlinea, margini e rientri dei bullet.
# ---

