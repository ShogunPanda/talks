layout: code
title: CODE-01 — Tokens, spaces and blank lines
code:
  language: javascript
  numbers: true
  content: |
    import { readFile } from 'node:fs/promises'

    const options = { enabled: true, retries: 3 }
    const message = 'Spaces   inside   a   string'

    async function load (path) {
      if (options.enabled) {
        return JSON.parse(await readFile(path, 'utf8'))
      }
      return null
    }
notes: |
  CODE-01. Origine: layout main/code e numerazione del talk test.
  Controllare token, spazi consecutivi, rientri, righe vuote e allineamento dei numeri
  a una e due cifre. Questo è il riferimento senza evidenziazioni.
