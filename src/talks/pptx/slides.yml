items:
  entries:
    - title: A deliberately wrapping inline banner
      text: 'The decorated span should wrap naturally. Its fragments are the test, not an overflow to hide.'
notes: |
  TEXT-03. Stress case derivato da TEXT-02, con lo stesso font e lo stesso layout.
