---
layout: code
title: CODE-02 — Highlight and dimming
code:
  language: javascript
  numbers: true
  highlight: '3, 7, 8'
  content: |
    import { readFile } from 'node:fs/promises'

    const options = { enabled: true, retries: 3 }
    const message = 'Spaces   inside   a   string'

    async function load (path) {
      if (options.enabled) {
        return JSON.parse(await readFile(path, 'utf8'))
      }
      return null
    }
notes: |
  CODE-02. Stesso codice di CODE-01 con righe 3, 7 e 8 evidenziate.
  Controllare opacity 0.5 delle altre righe, incluso sfondo e numerazione.
# ---

