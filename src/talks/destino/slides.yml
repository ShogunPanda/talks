---
title: Assets in memory. Saves on disk.
items:
  entries:
    - index: 1
      title: Pass assets through FFI
      text: Node reads WAD and SF2 assets and passes their bytes to native code.
    - index: 2
      title: Adapt native file access
      text: The engine uses memory-backed files in SEA mode.
    - index: 3
      title: Persist the saves
      text: Save files live on disk; other engine writes stay in process memory.
