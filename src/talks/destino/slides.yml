# ---

---
title: What was added?
content: Check it out at https://github.com/nodejs/node/pull/63068.
items:
  entries:
    - icon: bolt
      title: V8 Fast API path
      text: Eligible calls avoid the generic callback route.
    - icon: bridge
      title: Native trampolines
      text: Generated code adapts V8 calls to the target ABI.
    - icon: shield-halved
      title: Safe fallback
      text: Unsupported signatures continue through existing paths.
# ---

---
title: Why trampolines?
items:
  entries:
    - icon: bolt
      title: V8 Fast API skips the slow callback
      text: V8 can call a known, typed native function directly.
    - icon: code
      title: FFI symbols are discovered at runtime
      text: The target signature is not a handwritten C++ binding.
    - icon: shuffle
      title: Trampolines adapt the call
      text: They move arguments from V8's call shape into the target C ABI.
