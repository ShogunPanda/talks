---
title: The C platform layer
items:
  entries:
    - icon: power-off
      title: Initialize and cleanup
      text: Start Doom with assets and release native resources.
    - icon: forward-step
      title: Advance ticks and deliver input
      text: Let JavaScript drive the engine and forward key transitions.
    - icon: image
      title: Expose pixels and PCM
      text: Give JavaScript a framebuffer and blocks of mixed audio.
