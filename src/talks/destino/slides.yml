---
title: Every game needs input
items:
  entries:
    - icon: arrow-down
      title: Key press
      text: Movement starts when the key goes down.
    - icon: repeat
      title: Key repeat
      text: Holding a key must keep the action alive.
    - icon: arrow-up
      title: Key release
      text: Movement stops when the key comes back up.
  horizontal: true
# ---

---
title: Why the Kitty keyboard protocol?
items:
  entries:
    - icon: keyboard
      title: Terminals speak text
      text: Classic input streams are great for characters, not game controls.
    - icon: gamepad
      title: Doom needs state
      text: Controls depend on press, repeat, and release events being distinct.
    - icon: cat
      title: Kitty reports it
      text: Destino verifies press/repeat/release support.
  horizontal: true
# ---

---
title: Native mixing. JavaScript orchestration.
items:
  entries:
    - icon: volume-high
      title: Native code produces PCM
      text: TinyMidiLoader and TinySoundFont drive music; the C backend mixes effects.
    - icon: arrows-left-right
      title: Samples cross FFI in blocks
      text: Each tick produces 1,260 stereo frames at 44.1 kHz.
    - icon: scale-balanced
      title: Node feeds SDL3
      text: JavaScript queues the PCM and limits backlog without mixing individual samples.
