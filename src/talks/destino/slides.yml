---
title: Destino is not the hottest case
items:
  entries:
    - icon: stopwatch
      title: Doom runs at 35 Hz
      text: The main loop is steady, but not extreme.
    - icon: arrows-left-right
      title: Batch work across the boundary
      text: 44,100 audio frames per second become 35 PCM blocks, not 44,100 FFI calls.
    - icon: fire
      title: Real apps can be hotter
      text: Enterprise libraries may sit on critical paths.
