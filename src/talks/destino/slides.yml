---
title: Pretty much everything
content: And this is because *you* are in full control.
items:
  entries:
    - icon: ruler-horizontal
      title: Signature mismatch
      text: One wrong type can shift registers, stack slots, and return values.
    - icon: link-slash
      title: Unsafe memory access
      text: A bad pointer can read freed memory or overwrite valid data.
  horizontal: true
