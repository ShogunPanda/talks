---
title: How doomgeneric works
items:
  entries:
    - icon: microchip
      title: Doom stays portable
      text: The engine calls a tiny platform layer for video, input, timing, and shutdown.
    - icon: plug
      title: The platform fills the gaps
      text: Destino implements that layer as a native library that JavaScript can drive.
  horizontal: true
# ---

---
title: Everyone owns a piece
items:
  entries:
    - icon: rotate
      title: Node.js owns the loop
      text: JavaScript coordinates ticks, input, and cleanup.
    - icon: gear
      title: Doom owns the engine
      text: The game logic remains native and purpose-built.
    - icon: volume-high
      title: SDL owns the audio
      text: Sound stays where low-latency mixing already works.
  horizontal: true
