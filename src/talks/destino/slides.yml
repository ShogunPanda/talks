---
title: What is FFI?
items:
  entries:
    - icon: handshake
      title: Foreign Function Interface
      text: A bridge that lets code call functions from another runtime.
    - icon: code
      title: C as the common ground
      text: Most native libraries expose symbols using the C calling convention.
    - icon: language
      title: Languages can talk
      text: If both sides understand the ABI, JavaScript can call native code.
# ---

