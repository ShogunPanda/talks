title: Node.js SEA works, with a catch
items:
  entries:
    - icon: file-zipper
      title: SEA provides a virtual filesystem
      text: |
        JavaScript, libraries, and assets
        ship together with `useVfs`.
    - icon: folder-open
      title: Native I/O is a different boundary
      text: |
        C calls to `fopen()` do not automatically
        use Node's virtual filesystem.
  horizontal: true
