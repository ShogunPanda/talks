---
title: The 35 Hz loop
subtitle: Simplified orchestration; the renderer presents through OpenTUI.
code:
  language: javascript
  content: |
    // Simplified: error handling and cleanup omitted.
    setInterval(() => {
      engine.tick()
      audio.write(engine.renderAudio())
      renderer.render()

      if (engine.quitRequested()) {
        shutdown()
      }
    }, 1000 / 35)
  className:
    root: theme@code small
