---
title: '`node:ffi` changes the shape.'
content: Load a shared library, describe the ABI, and call native symbols directly from JavaScript.
code:
  language: javascript
  content: |
    import { dlopen } from 'node:ffi'

    const { functions } = dlopen(libPath, {
      tick: { arguments: [], return: 'void' },
      send_key: { arguments: ['uint8', 'int32'], return: 'void' },
      get_framebuffer: { arguments: [], return: 'pointer' }
    })


# ---

---
title: The boundary is explicit
items:
  entries:
    - icon: signature
      title: Symbols are named
      text: JavaScript points at the native entry points directly.
    - icon: ruler-combined
      title: Types are declared
      text: Arguments and return values become part of the call site.
    - icon: eye
      title: Risk is visible
      text: The dangerous part is not hidden inside generated glue.
