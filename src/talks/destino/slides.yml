---
title: The "choice"
items:
  entries:
    - icon: puzzle-piece
      title: Native addons
      text: |
        Powerful, but abstractions like NaN 
        used to break with Worker Threads.
    - icon: code
      title: Not direct enough
      text: |
        You still had to write a lot
        of glue code around the library.
  horizontal: true
