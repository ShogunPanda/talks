---
title: Framebuffer to terminal
items:
  entries:
    - icon: palette
      title: Doom exposes BGRA
      text: Native pixels are exposed through a borrowed Buffer.
    - icon: database
      title: JavaScript prepares RGBA
      text: Channels are converted before passing the frame to OpenTUI through FFI.
    - icon: expand
      title: OpenTUI speaks Kitty Graphics
      text: Native rendering produces the terminal output.
# ---

---
title: Terminals are weird
items:
  entries:
    - icon: square
      title: Cells are not pixels
      text: Geometry affects aspect ratio and perceived detail.
    - icon: scroll
      title: Layout can change
      text: Resizing and font changes affect how the frame fits.
    - icon: cat
      title: Negotiate, don't assume
      text: Require Kitty Graphics and query pixel geometry, with no fallback.
# ---

