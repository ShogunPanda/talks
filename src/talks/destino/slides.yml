---
title: The Destino stack
subtitle: Three native libraries. One JavaScript coordinator.
items:
  entries:
    - index: 1
      title: Node.js (https://github.com/nodejs/node)
      text: The best JavaScript runtime. *Ever.* 😈 It coordinates native calls through `node:ffi`.
    - index: 2
      title: doomgeneric (https://github.com/ozkl/doomgeneric)
      text: The game core and native adapters produce frames and audio samples.
    - index: 3
      title: OpenTUI + Kitty protocols + SDL3
      text: Kitty Graphics presents frames; Kitty keyboard reports key releases; SDL3 plays audio.
# ---

---
title: How doomgeneric works
items:
  entries:
    - icon: microchip
      title: Doom stays portable
      text: The engine calls a tiny platform layer for video, input, timing, and shutdown.
    - icon: plug
      title: The platform fills the gaps
      text: Destino implements that layer as a native library that JavaScript can drive.
  horizontal: true
# ---

---
title: Everyone owns a piece
items:
  entries:
    - icon: rotate
      title: |
        Node.js owns the 
        loop and the loading
      text: It parses input and coordinates ticks, video, audio, and cleanup.
    - icon: gear
      title: |
        Native code owns 
        the game and audio mixing
      text: The engine and audio backend produce pixels and PCM samples.
    - icon: volume-high
      title: |
        OpenTUI and SDL3
        handle output
      text: OpenTUI presents frames through Kitty Graphics; SDL3 plays PCM.
  horizontal: true
# ---

