---
title: The adapter, in pseudocode
code:
  language: output
  content: |
    // ARM64 pseudocode: CHECK_LIBRARY_OPEN and LOAD_ADDRESS are symbolic.
    adapter:
        stp x29, x30, [sp, #-16]!  // Save frame and return address.
        CHECK_LIBRARY_OPEN        // If closed: raise JS error, restore, return.

        // Entry: x0 = receiver, w1 = a, w2 = b.
        mov x0, x1                // First native argument: a.
        mov x1, x2                // Second native argument: b.

        LOAD_ADDRESS x16, add_i32  // Resolved native function address.
        // SAFETY: Open library; matching native signature.
        blr x16                   // Call add_i32; result in w0.

        ldp x29, x30, [sp], #16    // Restore frame and return address.
        ret                       // Back to V8 with the result.
# ---

