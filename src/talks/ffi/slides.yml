---
title: Bryan's first optimization
items:
  entries:
    - icon: user
      title: 'Shared-buffer path — [PR #62918](https://github.com/nodejs/node/pull/62918)'
      text: Bryan moved argument packing into JavaScript using a per-function ArrayBuffer.
    - icon: memory
      title: Share storage across the boundary
      text: Native code reads packed slots instead of converting each V8 argument.
    - icon: bolt
      title: Less crossing overhead
      text: libffi still performs the native call. This is not a SharedArrayBuffer between workers.
# ---

---
title: Pack once per call, reuse the storage
code:
  language: javascript
  content: |
    // Shared-buffer path: simplified internals, not a public API.
    // One ArrayBuffer per function; each slot is 8 bytes.
    const slots = new DataView(new ArrayBuffer(3 * 8))

    // On each call, after validating both int32 arguments:
    slots.setInt32(8, 20, true)   // Argument 0, slot 1.
    slots.setInt32(16, 22, true)  // Argument 1, slot 2.

    // C++ snapshots the arguments, then libffi invokes add_i32.
    invokeNativeWithoutJSArguments()

    const result = slots.getInt32(0, true) // Return slot: 42.
    // Less V8 argument conversion; libffi is still on the path.


