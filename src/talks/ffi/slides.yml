---
title: The adapter, in pseudocode
code:
  language: asm
  content: |
    ; ARM64 pseudocode; uppercase operations are symbolic.
    ; x0 = receiver, w1 = a, w2 = b. wN = low 32 bits of xN.
    ; sp = stack pointer; x29 = frame pointer; x30 = return address.

    stp x29, x30, [sp, #-16]! ; sp -= 16; save x29 and x30.
    CHECK_LIBRARY_OPEN      ; If closed: JS error, restore, return.
    mov x0, x1              ; Move a over the receiver.
    mov x1, x2              ; Move b into C's second argument.
    LOAD_ADDRESS x16, add_i32 ; Load the resolved target address.
    ; SAFETY: Open library; matching native signature.
    blr x16                 ; Call target; set x30; result in w0.
    ldp x29, x30, [sp], #16  ; Restore x29/x30; sp += 16.
    ret                     ; Return to V8 via x30; keep w0.


