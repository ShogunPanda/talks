title: A tiny trampoline bridges the gap
items:
  entries:
    - icon: user
      title: Bryan's trampoline idea and experiments
      text: '[PR #63140](https://github.com/nodejs/node/pull/63140) explored per-function stubs that remove V8’s receiver argument.'
    - icon: shuffle
      title: Adapt the registers
      text: 'AArch64 example: receiver in x0, user arguments in x1 and x2 → arguments in x0 and x1.'
    - icon: arrow-right
      title: Enter the native symbol
      text: Small generated machine-code adapters connect Fast API calls to the target ABI.
