---
title: We brought it home!
items:
  entries:
    - icon: code-merge
      title: '[PR #63068](https://github.com/nodejs/node/pull/63068) — June 16th, 2026'
      text: My Fast FFI implementation, co-authored with Bryan, landed for AArch64 and x86-64 SysV.
    - icon: filter
      title: Check eligibility before generating code
      text: Validate signature shape, register pressure, and executable-memory support.
    - icon: link
      title: One public API
      text: Optimized calls retain the same value validation and error contract as the generic path.
# ---

---
title: One boundary, many ABIs
items:
  entries:
    - icon: globe
      title: '[PR #63941](https://github.com/nodejs/node/pull/63941) extends the fast path'
      text: Windows x64/ARM64, PPC64LE, RISC-V 64, LoongArch64, and s390x where FFI is available.
    - icon: ruler-combined
      title: Each ABI has its own limits
      text: Registers, narrow returns, and buffer-shaped arguments need platform-specific handling.
    - icon: arrow-turn-down
      title: Signatures ineligible for the fast path still work
      text: 32-bit targets and PPC64BE use other paths; bundled libffi support is a separate question.
# ---

---
title: Three paths, one contract
items:
  entries:
    - index: 1
      title: Fast API
      text: Eligible signatures get a trampoline, plus a conventional entry point for unoptimized calls.
    - index: 2
      title: Shared buffer
      text: Pack arguments into slots, then call through libffi. Some pointer values take the generic route.
    - index: 3
      title: Generic
      text: Convert values in C++ and call through libffi. Covers every supported signature.
  horizontal: true
# ---

