---
title: Types are part of the call
items:
  entries:
    - icon: ruler-horizontal
      title: Use the declared width
      text: int8, uint32, float64... JavaScript numbers still need a native representation.
    - icon: calculator
      title: Use BigInt for 64-bit integer arguments
      text: Native int64 and uint64 values must not lose precision on the way in.
    - icon: code
      title: Match the actual declaration
      text: A wrong signature can corrupt a call. Type names do not inspect C headers.
# ---

---
layout: separator
title: With great power comes great responsibility™
image:
  url: '@talk/spider-panda.png'
options:
  background: red
# ---

---
title: A pointer is not an ownership model
items:
  entries:
    - icon: arrow-right
      title: JavaScript to native
      text: Buffers can lend their backing memory for the call; strings use temporary UTF-8 storage.
    - icon: arrow-left
      title: Native to JavaScript
      text: toBuffer copies by default; a zero-copy view still depends on native memory.
    - icon: clock
      title: Lifetime is your contract
      text: Keep memory alive and stable for as long as either side can access it.
# ---

---
title: Cleanup has an order
items:
  entries:
    - index: 1
      title: Stop native activity
      text: Make sure native code will no longer invoke callbacks or use borrowed memory.
    - index: 2
      title: Release owned resources
      text: Use the library's matching release functions while its code is still loaded.
    - index: 3
      title: Close the library
      text: DynamicLibrary supports `close()` and `Symbol.dispose`. Raw pointers are not revoked.
# ---

---
title: Callbacks cross the other way
items:
  entries:
    - icon: arrows-left-right
      title: '`registerCallback(signature, callback)`'
      text: Create a native function pointer backed by JavaScript through a libffi closure.
    - icon: microchip
      title: Same thread, synchronous result
      text: Invoke on the creating thread. Do not throw or return a Promise.
    - icon: clock
      title: Unregister after the last native use
      text: Never unregister an active callback or close its library while it is running.
# ---

---
title: Native does not mean asynchronous
items:
  entries:
    - icon: hourglass-half
      title: A synchronous call blocks its thread
      text: A slow native function can still stall the main event loop.
    - icon: code-branch
      title: Move suitable work to a worker
      text: Load and manage the library there, respecting its own thread-safety rules.
    - icon: rotate
      title: '`getCurrentEventLoop()`'
      text: Exposes the current uv_loop_t for native integration, not automatic offloading.
# ---

