---
title: How fast is Fast FFI?
content: 'Benchmarks run on a Apple M2 Max · Median ns/call, lower is better · 15 runs'
code:
  language: none
  content: |
    +----------------------+---------+---------+---------+---------+---------+
    | Benchmark            |  ffi-rs |   Koffi | Generic |  Shared | Fast API|
    +----------------------+---------+---------+---------+---------+---------+
    | identity-i32         | 1638.61 |   22.08 |   78.12 |   53.76 |    2.13 |
    | add-i32              | 2020.85 |   26.65 |   87.73 |   70.25 |    2.21 |
    | sum-8-i32            | 4178.95 |   51.51 |  122.69 |  124.65 |  124.73 |
    | sum-buffer: 64 B     | 2060.27 |   43.42 |  107.78 |   83.78 |   14.04 |
    | sum-buffer: 1 KiB    | 2094.26 |   97.19 |  161.94 |  138.32 |   68.80 |
    | sum-buffer: 16 KiB   | 2986.33 |  964.40 | 1037.58 | 1006.89 |  931.89 |
    +----------------------+---------+---------+---------+---------+---------+


