title: Pack once per call, reuse the storage
code:
  language: javascript
  content: |
    // Simplified internals: one reusable buffer per function.
    const slots = new DataView(new ArrayBuffer(3 * 8))

    // Each call validates and packs the arguments.
    slots.setInt32(8, 20, true)
    slots.setInt32(16, 22, true)

    // C++ snapshots the slots; libffi calls add_i32.
    invokeNativeWithoutJSArguments()

    const result = slots.getInt32(0, true) // 42


