---
title: Start with a native function
code:
  language: c
  content: |
    #include &lt;stdint.h&gt;

    // Export this symbol from the shared library.
    int32_t add_i32(int32_t a, int32_t b) {
      return a + b;
    }

    // Our example uses 20 and 22, within the int32 range.


# ---

---
title: Load. Describe. Call.
code:
  language: javascript
  content: |
    import { dlopen, suffix } from 'node:ffi'

    const { lib, functions } = dlopen(`./mylib.${suffix}`, {
      add_i32: {
        arguments: ['int32', 'int32'],
        return: 'int32'
      }
    })

    try {
      // SAFETY: The signature matches the exported C function.
      console.log(functions.add_i32(20, 22)) // 42
    } finally {
      lib.close()
    }


