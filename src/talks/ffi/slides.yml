---
title: A pointer is not an ownership model
items:
  entries:
    - icon: arrow-right
      title: JavaScript to native
      text: Buffers can lend their backing memory for the call; strings use temporary UTF-8 storage.
    - icon: arrow-left
      title: Native to JavaScript
      text: toBuffer copies by default; a zero-copy view still depends on native memory.
    - icon: clock
      title: Lifetime is your contract
      text: Keep memory alive and stable for as long as either side can access it.
# ---

---
title: Borrow bytes, not ownership
code:
  language: c
  content: |
    #include &lt;stdint.h&gt;

    uint32_t sum_bytes(const uint8_t *bytes, uint32_t length) {
      uint32_t total = 0;
      for (uint32_t i = 0; i < length; i++) {
        // SAFETY: The caller provides at least length readable bytes.
        total += bytes[i];
      }
      return total;
    }

    // Synchronous: the pointer is never retained.
    // Unsigned addition wraps modulo 2^32.


# ---

---
title: A Buffer crosses the boundary
code:
  language: javascript
  content: |
    import { dlopen, suffix } from 'node:ffi'

    using handle = dlopen(`./mylib.${suffix}`, {
      sum_bytes: {
        arguments: ['buffer', 'uint32'], return: 'uint32'
      }
    })
    const bytes = Buffer.from([10, 20, 12])

    // SAFETY: Live, stable storage; C reads only bytes.length bytes.
    console.log(handle.functions.sum_bytes(bytes, bytes.length)) // 42

    // No copy of the payload; no transfer of ownership.
    // C must not keep this pointer after returning.


# ---

---
title: Cleanup has an order
items:
  entries:
    - index: 1
      title: Stop native activity
      text: Make sure native code will no longer invoke callbacks or use borrowed memory.
    - index: 2
      title: Release owned resources
      text: Use the library's matching release functions while its code is still loaded.
    - index: 3
      title: Close the library
      text: DynamicLibrary supports `close()` and `Symbol.dispose`. Raw pointers are not revoked.
# ---

---
title: Callbacks cross the other way
items:
  entries:
    - icon: arrows-left-right
      title: '`registerCallback(signature, callback)`'
      text: Create a native function pointer backed by JavaScript through a libffi closure.
    - icon: microchip
      title: Same thread, synchronous result
      text: Invoke on the creating thread. Do not throw or return a Promise.
    - icon: clock
      title: Unregister after the last native use
      text: Never unregister an active callback or close its library while it is running.
# ---

---
title: C calls JavaScript, then returns
code:
  language: c
  content: |
    #include &lt;stdint.h&gt;

    typedef int32_t (*transform_fn)(int32_t);

    int32_t apply_once(int32_t value, transform_fn transform) {
      // SAFETY: A live callback is invoked on its creating thread.
      return transform(value);
    }

    // The callback runs synchronously, exactly once.
    // The library never retains its address.


# ---

---
title: Register. Call. Unregister.
code:
  language: javascript
  content: |
    import { dlopen, suffix } from 'node:ffi'
    using handle = dlopen(`./mylib.${suffix}`, {
      apply_once: { arguments: ['int32', 'function'], return: 'int32' }
    })
    const callback = handle.lib.registerCallback(
      { arguments: ['int32'], return: 'int32' }, value => value
    )
    try {
      // SAFETY: Same-thread, synchronous callback; no throw or Promise.
      console.log(handle.functions.apply_once(42, callback)) // 42
    } finally {
      // SAFETY: apply_once has returned and never retains the callback.
      handle.lib.unregisterCallback(callback)
    }


# ---

---
title: Native does not mean asynchronous
items:
  entries:
    - icon: hourglass-half
      title: A synchronous call blocks its thread
      text: A slow native function can still stall the main event loop.
    - icon: code-branch
      title: Move suitable work to a worker
      text: Load and manage the library there, respecting its own thread-safety rules.
    - icon: rotate
      title: '`getCurrentEventLoop()`'
      text: Exposes the current uv_loop_t for native integration, not automatic offloading.
