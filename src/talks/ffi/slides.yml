title: What is FFI?
items:
  entries:
    - icon: handshake
      title: Foreign Function Interface
      text: Call functions written in one language from another.
    - icon: microchip
      title: Same process, native code
      text: Load a shared library and invoke its exported symbols.
    - icon: language
      title: A common binary contract
      text: C-compatible entry points can connect C, C++, Rust, Zig, and more.
# ---

---
title: The ABI is the contract
items:
  entries:
    - icon: signature
      title: Names and types
      text: Which symbol? Which arguments? Which return value?
    - icon: ruler-combined
      title: Binary representation
      text: Sizes, alignment, and memory layout must agree.
    - icon: shuffle
      title: Calling convention
      text: Each value must go in the correct register or stack slot.
  horizontal: true
