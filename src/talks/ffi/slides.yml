---
title: Why put FFI in core?
items:
  entries:
    - icon: box-open
      title: One fewer native addon to distribute
      text: The FFI bridge ships with Node.js. Your target library still needs a compatible binary.
    - icon: link
      title: Runtime integration
      text: Coordinate V8 fast calls, environments, permissions, and releases in one project.
    - icon: globe
      title: Portability maintained in core
      text: Test the FFI bridge and its ABI support alongside Node.js on supported platforms.
