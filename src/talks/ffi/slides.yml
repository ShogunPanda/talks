title: How fast is Fast FFI?
items:
  entries:
    - icon: bolt
      title: 'Tiny native work: +2601.42%'
      text: '`identity-i32`: about 27× baseline throughput. Removing crossing overhead matters.'
    - icon: equals
      title: 'Eight int32 arguments: −0.63%'
      text: '`sum-8-i32`: no statistically significant improvement in this comparison.'
    - icon: database
      title: 'More native work: +496.73% → +7.98%'
      text: '`sum-buffer`, 64 → 16384 bytes. Historical [PR #63068 results](https://github.com/nodejs/node/pull/63068#issuecomment-4691945167), not universal speedups.'
