---
title: Every crossing has a cost
items:
  entries:
    - index: 1
      title: Enter the native callback
      text: It receives JavaScript values through V8's callback API.
    - index: 2
      title: Convert and marshal
      text: Validate values and prepare native arguments for libffi.
    - index: 3
      title: Call and convert back
      text: Invoke the symbol, then expose its result to JavaScript.
  horizontal: true
# ---

---
title: Bryan's first optimization
items:
  entries:
    - icon: user
      title: 'Shared-buffer path — [PR #62918](https://github.com/nodejs/node/pull/62918)'
      text: Bryan moved argument packing into JavaScript using a per-function ArrayBuffer.
    - icon: memory
      title: Share storage across the boundary
      text: Native code reads packed slots instead of converting each V8 argument.
    - icon: bolt
      title: Less crossing overhead
      text: libffi still performs the native call. This is not a SharedArrayBuffer between workers.
# ---

---
title: V8 already knows a faster route
items:
  entries:
    - icon: bolt
      title: Fast API calls
      text: Optimized JavaScript can call a typed native entry point directly.
    - icon: signature
      title: FFI signatures arrive at runtime
      text: The loaded symbol is not a handwritten binding compiled into Node.js.
    - icon: puzzle-piece
      title: The shapes must match
      text: V8's native entry point and the library's C function have different contracts.
# ---

