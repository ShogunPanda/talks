title: Types are part of the call
code:
  language: javascript
  content: |
    // C: uint64_t identity_u64(uint64_t value);
    const identity = lib.getFunction('identity_u64', {
      arguments: ['uint64'],
      return: 'uint64'
    })

    // SAFETY: The declaration matches the exported symbol.
    const value = identity(9_007_199_254_740_993n)
    console.log(value) // 9007199254740993n

    // A number would already have lost precision.


